manifest_schema: 1
corpus_version: v1

document_collection: rag_operational_v1
schema_collection: rag_schema_meta_v1

embedding:
  model: all-MiniLM-L6-v2
  dimension: 384

# Contextual prefixes affect stored vectors, so the model is corpus provenance.
contextualization_model: mistralai/mistral-nemo

chunking:
  chunk_size: 512
  overlap: 64

documents:
  - source_id: procedure_pdf
    path: tests/fixtures/sample_procedure.pdf
    sha256: 47f0457bc45289f9f99923ede87b524e8c417db286ad5f486a741bd654a1494a
    doc_type: procedure
    venue: Fairfield_RSL
    date: "2026-05-01"
    shift_id: N/A
  - source_id: compliance_pdf
    path: tests/fixtures/sample_compliance.pdf
    sha256: 2700a2283108947df9124cafb388090c4f15cab3e668b9dd2c9629282e80b8b0
    doc_type: compliance
    venue: Fairfield_RSL
    date: "2026-04-01"
    shift_id: N/A
  - source_id: shift_log.txt
    path: tests/fixtures/sample_shift_log.txt
    sha256: 26db3fdcab2e744aa37b36c5dbf6f253a8d2da3a5f6d1b1f5ebce03fd42a63fc
    doc_type: shift_log
    venue: Fairfield_RSL
    date: "2026-05-28"
    shift_id: SH-001

structured_data:
  - table: shift_records
    path: tests/fixtures/shift_records.csv
    sha256: 7fba04dab260ac38e9509679d60d64bf5376448592e29c639e73f6c208789fae
  - table: incident_logs
    path: tests/fixtures/incident_logs.csv
    sha256: eb4836a8f4d1adf44412be65682db4d562ee616880ca779e9ad535e1b3fda474
  - table: staffing_history
    path: tests/fixtures/staffing_history.csv
    sha256: efac34cca395f0edbcf1ecf2ed4d24af3ad274139663a07b20a5dbe3b906aa0c

schema_views:
  - view_name: v_shift_summary
    columns: [venue, date, shift_type, total_staff]
    description: Aggregated staff counts per venue, date, and shift type. Use for staffing level queries.
    example_query: SELECT venue, date, total_staff FROM v_shift_summary WHERE venue = 'Fairfield RSL'
  - view_name: v_incident_by_venue
    columns: [venue, date, incident_type, incident_count]
    description: Count of incidents grouped by venue, date, and incident type. Use for incident frequency analysis.
    example_query: SELECT venue, incident_type, incident_count FROM v_incident_by_venue WHERE date = '2026-05-28'
  - view_name: v_staffing_gap
    columns: [venue, date, role, count, required_count, gap]
    description: Staffing gap analysis where a negative gap means understaffed.
    example_query: SELECT venue, role, gap FROM v_staffing_gap WHERE gap < 0
  - view_name: v_incident_severity
    columns: [incident_id, shift_id, venue, date, incident_type, description, severity]
    description: High-severity incidents for safety and compliance queries.
    example_query: SELECT venue, date, description FROM v_incident_severity
  - view_name: v_peak_staffing
    columns: [shift_id, venue, date, staff_count, shift_type, avg_staff]
    description: Shifts where staff count exceeded the venue average for peak demand analysis.
    example_query: SELECT venue, date, staff_count, avg_staff FROM v_peak_staffing
  - view_name: v_shift_details
    columns: [shift_id, venue, date, staff_count, shift_type, supervisor]
    description: One record per operational shift, including its supervisor. Use for shift-specific detail and supervisor queries.
    example_query: SELECT shift_id, supervisor FROM v_shift_details WHERE shift_id = 'SH-001'
  - view_name: v_incident_by_shift
    columns: [shift_id, venue, date, incident_count]
    description: Count of all logged incidents per shift. Use for incident totals by shift.
    example_query: SELECT shift_id, incident_count FROM v_incident_by_shift WHERE shift_id = 'SH-006'
  - view_name: v_shift_staffing_evidence
    columns: [shift_id, venue, date, role, count, required_count, gap]
    description: Staffing evidence joined to shifts by venue and date, only where a staffing record exists. Negative gap means understaffed; absence of a row is not evidence that staffing met requirements.
    example_query: SELECT shift_id, role, gap FROM v_shift_staffing_evidence WHERE gap < 0
