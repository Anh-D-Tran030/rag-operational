[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-operational"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pydantic-settings",
    "PyYAML==6.0.3",
    "qdrant-client>=1.9",
    "pymupdf4llm",
    "sentence-transformers",
    "flashrank",
    "httpx",
    "python-dotenv",
    "prometheus-client",
    "prometheus-fastapi-instrumentator==6.1.*",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "aiosqlite",
    "rank-bm25",
    "openai",
    "gptcache",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
]

[project.optional-dependencies]
guardrails = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2", "spacy>=3.7"]
observability = ["langfuse>=3"]
ui = ["streamlit", "requests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
